[project]
name = "PRISM"
version = "0.0.1"
description = ""
authors = [
    { name = "Pham Tung Thuy"},
    { name = "Dương Minh Quân"},
    { name = "Lương Duy Quân"}
]
license = { file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10,<3.12"

dependencies = [
    "loguru==0.7.3",
    "click==8.2.1",
    "requests==2.32.4",
    "tenacity==9.1.2",
    "tqdm==4.67.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]

# ── Lean: just the CRUD / tasks API server ──────────────────────────
tasks-server = [
    "fastapi==0.115.9",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "minio>=7.2",
    "alembic==1.15.2",
    "python-multipart",
    "aiofiles>=24.1.0",
    "appdirs>=1.4.4",
    "loguru==0.7.3",
]

# ── ML / pipeline heavy dependencies ────────────────────────────────
ml = [
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
    "transformers==4.52.4",
    "diffusers==0.33.1",
    "huggingface_hub==0.33.0",
    "scipy==1.15.3",
    "pandas==2.3.0",
    "datasets==3.6.0",
    "pillow==11.2.1",
    "soundfile==0.13.1",
    "opencv-python==4.12.0.88",
    "moviepy==2.2.1",
    "scikit-learn==1.7.0",
    "keras==3.11.2",
    "tensorflow",
    "openai==1.86.0",
    "anthropic==0.54.0",
    "tiktoken==0.9.0",
    "nltk==3.9.1",
    "chardet==5.2.0",
    "rank_bm25==0.2.2",
    "langchain_chroma==0.2.4",
    "langchain_core==0.3.65",
    "langchain_openai==0.3.23",
    "tree-sitter-python==0.21",
    "tree_sitter==0.22.3",
    "nbformat==5.10.4",
    "nbclient==0.10.2",
    "ipython==8.37.0",
    "ipykernel==6.30.0",
    "codebleu==0.7.0",
    "networkx==3.4.2",
    "matplotlib==3.10.3",
    "sentencepiece (>=0.2.0,<0.3.0)",
    "termcolor (>=3.1.0,<4.0.0)",
    "rouge-score (>=0.1.2,<0.2.0)",
    "pydub==0.25.1",
    "openpyxl==3.1.5",
    "pytesseract==0.3.13",
    "ffmpeg-python==0.2.0",
    "cassio>=0.1.7",
    "diskcache>=5.6.3",
]

# ── MLE-bench / evaluation dependencies ─────────────────────────────
mlebench = [
    "kaggle>=1.6,<1.7",
    "gdown==5.2.0",
    "py7zr>=0.21",
]

# ── Everything (backwards-compatible with the old "tasks" extra) ────
tasks = [
    "PRISM[tasks-server]",
    "PRISM[ml]",
    "PRISM[mlebench]",
]

models = []

[tool.poetry]
package-mode = false